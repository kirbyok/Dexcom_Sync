services:
  dexcom-sync:
    build: .
    container_name: dexcom-sync
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    command: ["python", "main.py", "continuous"]
  
  glooko-sync:
    build: .
    container_name: glooko-sync
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    command: ["python", "glooko_main.py", "continuous"]

